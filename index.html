<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/navbar_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Prestigious Best of Edo Award (BOEA) — Rewarding Excellence</title>
    <meta name="description" content="The Official Platform for The Prestigious Best of Edo Award. Celebrating royal Edo heritage, cultural pride, and global leadership across Edo South, Edo North, and Edo Central." />
    <meta name="theme-color" content="#6e1e2a" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Prestigious Best of Edo Award (BOEA) — Rewarding Excellence" />
    <meta property="og:description" content="Celebrating royal Edo heritage, cultural pride, civic impact, and global leadership." />
    <meta property="og:image" content="/assets/navbar_logo.png" />
    <meta property="og:image:secure_url" content="/assets/navbar_logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="https://bestofedoaward.com" />
    <meta property="og:site_name" content="Best of Edo Award" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="The Prestigious Best of Edo Award (BOEA)" />
    <meta name="twitter:description" content="Celebrating royal Edo heritage, cultural pride, civic impact, and global leadership." />
    <meta name="twitter:image" content="/assets/navbar_logo.png" />

    <!-- Set theme before paint to avoid flash -->
    <script>
      (function () {
        var t = localStorage.getItem('boea-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
